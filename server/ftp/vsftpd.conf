# docker-server — vsftpd. Les ports passifs et l'adresse sont réglés au démarrage.
listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002
file_open_mode=0666
chroot_local_user=YES
allow_writeable_chroot=YES
check_shell=NO
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=127.0.0.1
pasv_addr_resolve=NO
connect_from_port_20=NO
use_localtime=YES
hide_ids=YES
max_clients=50
max_per_ip=20
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=NO
vsftpd_log_file=/proc/1/fd/1
ftpd_banner=docker-server FTP
