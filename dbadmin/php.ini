; DB Admin — réglages PHP (monté dans le container : modifiable à chaud, puis redémarrer le service
; « docker restart ds-dbadmin »).
; Gros dumps : pas de limite de temps, uploads de plusieurs Go acceptés.
upload_max_filesize = 4G
post_max_size       = 4G
memory_limit        = 1G
max_execution_time  = 0
max_input_time      = -1
default_charset     = "UTF-8"
display_errors      = Off
log_errors          = On
